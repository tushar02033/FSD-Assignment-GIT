<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBoard · Get things done</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="board">
    <header class="head">
      <div>
        <p class="sticker">TO-DO LIST</p>
        <h1>Task<span>Board</span></h1>
      </div>
      <div class="score" aria-label="Progress">
        <strong id="doneCount">0</strong><small>/<span id="totalCount">0</span> done</small>
      </div>
    </header>

    <div class="meter" aria-hidden="true"><div id="bar"></div></div>

    <form id="addForm" class="add" autocomplete="off">
      <input id="taskInput" type="text" placeholder="What needs doing?" maxlength="120" aria-label="New task">
      <select id="priority" aria-label="Priority">
        <option value="low">Low</option>
        <option value="med" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input id="dueDate" type="date" aria-label="Due date">
      <button type="submit" id="addBtn">+ Add</button>
      <p class="form-msg" id="formMsg" role="alert"></p>
    </form>

    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="Filter tasks">
        <button class="tab is-on" data-filter="all" role="tab">All</button>
        <button class="tab" data-filter="active" role="tab">Active</button>
        <button class="tab" data-filter="done" role="tab">Done</button>
      </div>
      <input id="search" type="search" placeholder="Search…" aria-label="Search tasks">
    </div>

    <ul id="taskList" class="list"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer class="foot">
      <span id="leftCount">0 items left</span>
      <button type="button" id="clearDone" class="ghost">Clear completed</button>
    </footer>
    <p class="tip">Double-click a task to edit · Enter saves · Esc cancels</p>
  </main>

  <div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undoBtn" type="button">Undo</button></div>
  <script src="script.js"></script>
</body>
</html>
